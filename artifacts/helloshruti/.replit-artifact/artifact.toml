kind = "web"
previewPath = "/"
title = "HelloShruti"
version = "1.0.0"
id = "artifacts/helloshruti"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20146

[services.development]
run = "pnpm --filter @workspace/helloshruti run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/helloshruti", "run", "build" ]
serve = "static"
publicDir = "artifacts/helloshruti/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20146"
BASE_PATH = "/"
